<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>すべてのすがた図鑑</title>
    <style>
        :root { --primary: #3f51b5; --accent: #caa8da; --bg: #f0f4f8; --text: #2c3e50; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text); }
        .controls { position: sticky; top: 0; background: rgba(240, 244, 248, 0.95); padding: 15px; z-index: 100; border-bottom: 2px solid #d1d9e6; backdrop-filter: blur(5px); text-align: center; }
        .search-box { width: 100%; max-width: 500px; padding: 12px 20px; border-radius: 25px; border: 1px solid #ccc; font-size: 16px; outline: none; margin-bottom: 10px; }
        .filters { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; align-items: center; }
        button, select { padding: 8px 12px; border-radius: 8px; border: 1px solid #ccc; background: white; cursor: pointer; font-size: 13px; outline: none; }
        .btn-main { background: var(--primary); color: white; border: none; }
        .active-filter { background: #e67e22 !important; }
        .container { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 15px; margin-top: 20px; max-width: 1400px; margin-left: auto; margin-right: auto; }
        .card { background: white; border-radius: 15px; padding: 12px; width: 140px; transition: 0.2s; position: relative; cursor: pointer; display: flex; flex-direction: column; align-items: center; border: 2px solid transparent; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }

        .active-filter {
            border: 1px solid #e67e22 !important; /* 枠線を強調 */
            background-color: #fff !important;     /* 背景は白のまま維持 */
        }

        /* 登録状況の視覚化 */
        .card.is-registered { border-color: var(--accent) !important; opacity: 1; filter: grayscale(0%); }
        .card.unregistered { opacity: 0.5; filter: grayscale(80%); }

        .card > img { 
            width: 100px; 
            height: 100px; 
            object-fit: contain; 
            margin-bottom: 8px; 
        }

        .no-text { font-weight: bold; color: var(--primary); font-size: 11px; }
        .jp-name {
            font-weight: bold;
            font-size: 13px;
            margin: 2px 0;
            text-align: center;
            height: 2.4em;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .badge { position: absolute; top: 8px; right: 8px; font-size: 9px; padding: 2px 6px; border-radius: 10px; color: white; font-weight: bold; }
        .badge-shiny-icon {
            position: absolute;
            width: 24px !important;
            height: 24px !important;
            top: 8px;      /* 上からの位置 */
            right: 8px;    /* 右からの位置 */
            width: 24px;   /* アイコンのサイズ（お好みで調整） */
            height: 24px;
            z-index: 110;  /* 性別マークより上にくるように設定 */
            pointer-events: none; /* クリックの邪魔をしない */
        }
        .soft-icons { display: flex; gap: 3px; margin-top: 5px; flex-wrap: wrap; justify-content: center; }
        .soft-badge { font-size: 12px; padding: 1px 6px 3px 6px; border-radius: 3px; background: #eee; color: #777; font-weight: bold; }
        .soft-badge.active { background: #34495e; color: white; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; max-width: 500px; width: 90%; position: relative; max-height: 80vh; overflow-y: auto; text-align: left; }
        .close-btn { position: absolute; right: 20px; top: 20px; font-size: 24px; cursor: pointer; }
        #status { font-size: 12px; color: #666; margin-top: 10px; text-align: center; }

        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .loader { width: 60px; height: 60px; border: 5px solid #fff; border-top: 5px solid #ff1c1c; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { font-weight: bold; color: var(--primary); letter-spacing: 2px; }

        .status-icons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
            width: 100%;
        }
        .status-icons .icon-btn {
            width: 30px !important;
            height: 30px !important;
            cursor: pointer;
            transition: 0.2s;
            object-fit: contain;
            flex-shrink: 0;
        }
        .is-off { filter: grayscale(100%); opacity: 0.3; }
        .icon-btn:hover { transform: scale(1.1); }

        .is-disabled {
            cursor: not-allowed !important;
            opacity: 0.05 !important;
            display:none !important;
            pointer-events: none !important;
            filter: grayscale(100%) !important;
        }

        .gender-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            font-size: 14px;
            font-weight: bold;
            z-index: 100;
            pointer-events: none;
        }
        .gender-male { color: #3498db; }
        .gender-female { color: #e74c3c; }
        .gender-both { color: #ca9dce; }
        .gender-none { color: #cccccc; font-size: 9px; }

        /* すがた名のスタイル */
        .sub-name {
            font-size: 0.8em;      /* 少し小さく */
            color: #7f8c8d;       /* 少し薄いグレーに */
            font-weight: normal;  /* 太字を解除 */
            display: block;       /* 確実に改行させる */
            margin-top: 2px;
        }

        /* 親要素（jp-name）の調整 */
        .jp-name {
            font-weight: bold;
            font-size: 13px;
            margin: 2px 0;
            text-align: center;
            height: 3.2em;        /* 2行分がしっかり収まるように少し高くする */
            display: flex;
            flex-direction: column; /* 縦に並べる */
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #modal-nav button {
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        #modal-nav button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        #modal-nav button:hover:not(:disabled) {
            background-color: var(--primary) !important;
            color: white;
        }

        .nav-arrow {
            background: rgba(0, 0, 0, 0.05);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            flex-shrink: 0; /* 潰れないように固定 */
        }

        .nav-arrow:hover:not(:disabled) {
            background: var(--primary);
            color: white;
        }

        .nav-arrow:disabled {
            opacity: 0; /* 押せない時は消してしまうのがスッキリします */
            cursor: default;
        }

        /* スマホ等でボタンが邪魔な場合はサイズを調整 */
        @media (max-width: 600px) {
            .nav-arrow { width: 30px; height: 30px; font-size: 16px; }
        }

        .evolution-link {
            color: var(--primary); /* テーマカラーに合わせる */
            text-decoration: underline;
            cursor: pointer;
            transition: 0.2s;
            display: inline-block;
            padding: 2px 5px;
        }

        .evolution-link:hover {
            background-color: rgba(0, 0, 0, 0.05);
            border-radius: 4px;
            color: #ff4757; /* ホバー時の色を変えるなど */
        }

        /* アイコンを並べるコンテナ */
        .mini-link-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 5px;
        }

        /* 各画像アイテムの枠 */
        .mini-link-item {
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            border-radius: 8px;
            background: #f8f9fa;
            padding: 4px;
            border: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mini-link-item:hover {
            transform: scale(1.1);
            background: #e9ecef;
            border-color: var(--accent);
        }

        /* ミニ画像のサイズ調整 */
        .mini-evo-img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .modal-shiny-btn {
            position: absolute;
            top: 0;
            right: 0;
            padding: 5px 10px;
            font-size: 11px;
            border-radius: 15px;
            border: 1px solid #ccc;
            background: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .modal-shiny-btn.active {
            background: #f1c40f; /* 金色 */
            color: #fff;
            border-color: #f1c40f;
            box-shadow: 0 0 8px rgba(241, 196, 15, 0.5);
        }

        .poke-link {
            display:block; 
            text-align:center; 
            color:var(--primary); 
            text-decoration:none; 
            font-weight:bold; 
            background:#eee; 
            padding:10px; 
            border-radius:10px;
        }


    </style>
</head>
<body>

<div id="loading-screen">
    <div class="loader"></div>
    <div class="loading-text" id="loading-msg">DATA SYNCING...</div>
</div>

<div class="controls">
    <h1>すべてのすがた図鑑</h1>
    <input type="text" id="search" class="search-box" placeholder="名前、番号、メモで検索...">
    
    <div class="filters">
        <label>
            <select id="filter-gen" onchange="render()">
                <option value="all">世代</option>
                <option value="Gen1">第1世代</option><option value="Gen2">第2世代</option>
                <option value="Gen3">第3世代</option><option value="Gen4">第4世代</option>
                <option value="Gen5">第5世代</option><option value="Gen6">第6世代</option>
                <option value="Gen7">第7世代</option><option value="Gen8">第8世代</option>
                <option value="Gen9">第9世代</option>
            </select>
        </label>

        <label>
            <select id="filter-cat" onchange="render()">
                <option value="all">カテゴリ</option>
                <option value="デフォルト">デフォルト</option>
                <option value="しゆうちがい">しゆうちがい</option>
                <option value="すがたちがい">すがたちがい</option>
                <option value="フォルムちがい">フォルムちがい</option>
                <option value="アローラのすがた">アローラのすがた</option>
                <option value="ガラルのすがた">ガラルのすがた</option>
                <option value="ヒスイのすがた">ヒスイのすがた</option>
                <option value="パルデアのすがた">パルデアのすがた</option>
                <option value="メガシンカ">メガシンカ</option>
                <option value="キョダイマックス">キョダイマックス</option>
            </select>
        </label>

        <label>
            <select id="filter-soft" onchange="render()">
                <option value="all">実装ソフト</option>
                <option value="実装 (GO)">GO</option>
                <option value="実装 (ピカブイ)">ピカブイ</option>
                <option value="実装 (剣盾)">剣盾</option>
                <option value="実装 (BDSP)">BDSP</option>
                <option value="実装 (アルセウス)">アルセウス</option>
                <option value="実装 (SV)">SV</option>
                <option value="実装 (Z-A)">Z-A</option>
            </select>
        </label>

        <label>
            <select id="filter-reg" onchange="render()">
                <option value="all">図鑑登録</option>
                <option value="registered">登録済</option>
                <option value="unregistered">未登録</option>
            </select>
        </label>

        <label>
            <select id="filter-own" onchange="render()">
                <option value="all">所持状況</option>
                <option value="所持">所持</option>
                <option value="未所持">未所持</option>
                <option value="不可">不可</option>
            </select>
        </label>

        <button onclick="resetFilters()" style="background:#95a5a6; color:white; border:none;">フィルタリセット</button>
        <button id="btn-shiny" onclick="toggleFilter('shiny')">色違いモード</button>
    </div>
    <div id="status">準備中...</div>
</div>

<div class="container" id="gallery"></div>

<div id="detailModal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="document.getElementById('detailModal').style.display='none'">×</span>
        
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
            <button id="prev-btn" class="nav-arrow" onclick="navDetail(-1)">&#10094;</button>
            
            <div id="modal-body" style="flex: 1;">
                </div>
            
            <button id="next-btn" class="nav-arrow" onclick="navDetail(1)">&#10095;</button>
        </div>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyrvdb8OfjjeNQ5GPxqZusOOm2r9BnQ8gTQXyFAzDfiOZNh47D3LnV2uh1r-ftNo5Dk/exec";
    const ICON_REG = "image-assets/icon_reg.png";
    const ICON_OWN = "image-assets/icon_own.png";

    let allSprites = [];
    let currentFilteredList = []; // 現在表示中のリストを保持
    let currentViewIndex = -1;    // 現在モーダルで開いているポケモンのインデックス
    let filters = { shiny: false };
    let isModalShiny = false;

    async function init() {
        const status = document.getElementById('status');
        const loadingScreen = document.getElementById('loading-screen');
        const loadingMsg = document.getElementById('loading-msg');

        status.innerText = "データを取得・展開中...";

        try {
            const response = await fetch(GAS_URL);
            const sheetData = await response.json();
            const expandedData = [];

            sheetData.forEach(item => {
                const id = item["全国図鑑No"]; 
                const name = item["名前"] || "";
                const genderVal = item["性別"] ? String(item["性別"]).trim() : "";

                // 通常色
                expandedData.push({
                    ...item,
                    id: id,
                    uKey: `${id}_${name}_normal`,
                    isShiny: false,
                    displayName: name,
                    gender: genderVal,
                    imgUrl: item["画像"] || "", 
                    regStatus: (String(item["HOME 図鑑登録"]).trim().toUpperCase() === "YES"),
                    ownStatus: item["HOME 所持状況"] || "未所持"
                });

                // 色違い
                expandedData.push({
                    ...item,
                    id: id,
                    uKey: `${id}_${name}_shiny`,
                    isShiny: true,
                    displayName: name,
                    gender: genderVal,
                    imgUrl: item["画像 (色違い)"] || "", 
                    regStatus: (String(item["HOME 図鑑登録 (色違い)"]).trim().toUpperCase() === "YES"),
                    ownStatus: item["HOME 所持状況 (色違い)"] || "不可"
                });
            });

            allSprites = expandedData;
            status.innerText = `読み込み完了: ${sheetData.length}種`;
            loadFilters();
            if (loadingScreen) loadingScreen.style.display = 'none';
            render();

        } catch (e) {
            console.error("読み込みエラー:", e);
            if (loadingMsg) { loadingMsg.innerText = "SYNC ERROR"; loadingMsg.style.color = "#ff4444"; }
            status.innerText = "データの同期に失敗しました。";
        }
    }

    function render() {
    
        const filterIds = ['filter-gen', 'filter-cat', 'filter-soft', 'filter-reg', 'filter-own'];
        filterIds.forEach(id => {
            const select = document.getElementById(id);
            if (select.value !== 'all') {
                select.classList.add('active-filter');
            } else {
                select.classList.remove('active-filter');
            }
        });

        const query = document.getElementById('search').value.toLowerCase();
        const genFilter = document.getElementById('filter-gen').value;
        const softFilter = document.getElementById('filter-soft').value;
        const regFilter = document.getElementById('filter-reg').value;
        const catFilter = document.getElementById('filter-cat').value;
        const ownFilter = document.getElementById('filter-own').value;

        const gallery = document.getElementById('gallery');

        const filtered = allSprites.filter(s => {
            const name = String(s["名前"] || "").toLowerCase();
            const memo = String(s["メモ"] || "").toLowerCase();
            const matchQuery = name.includes(query) || String(s.id).includes(query) || memo.includes(query);
            const matchGen = genFilter === 'all' || String(s["世代"]).includes(genFilter);
            
            const checkYes = (val) => {
                if (!val) return false;
                const str = String(val).trim().toUpperCase();
                return str === "YES" || str === "TRUE";
            };
            const matchSoft = softFilter === 'all' || checkYes(s[softFilter]);
            
            let matchReg = true;
            if (regFilter === 'registered') matchReg = s.regStatus;
            if (regFilter === 'unregistered') matchReg = !s.regStatus;

            const matchShiny = filters.shiny ? s.isShiny : !s.isShiny;
            const matchCategory = catFilter === 'all' || String(s["カテゴリ"] || "").includes(catFilter);

            let matchOwn = true;
            if (ownFilter !== 'all') {
                matchOwn = (s.ownStatus === ownFilter);
            }

            return matchQuery && matchGen && matchSoft && matchReg && matchShiny && matchCategory && matchOwn;
        });

        currentFilteredList = filtered;

        gallery.innerHTML = filtered.map(s => {
            const isReg = s.regStatus;
            const status = s.ownStatus ? String(s.ownStatus).trim() : "";
            const regClass = isReg ? 'is-registered' : 'unregistered';
            const isDisabled = status === "不可";
            const isOff = status === "未所持";
            const displayImg = s.imgUrl || "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/0.png";

            let genderHtml = '';
            const g = String(s.gender || "").trim();
            if (g === '♂' || g === 'オス') {
                genderHtml = '<div class="gender-badge gender-male">♂</div>';
            } else if (g === '♀' || g === 'メス') {
                genderHtml = '<div class="gender-badge gender-female">♀</div>';
            } else if (g === '♂♀' || g === '両性' || g === 'オス・メス') {
                genderHtml = '<div class="gender-badge gender-both"><span style="color: #3498db;">♂</span><span style="color: #e74c3c">♀</span></div>';
            } else if (g === 'None' || g === '不明') {
                genderHtml = '<div class="gender-badge gender-none">none</div>';
            }

            return `
                <div class="card ${regClass}" onclick="showDetail('${s.uKey}')">
                    ${genderHtml} ${s.isShiny ? '<img src="image-assets/icon_shiny.png" class="badge-shiny-icon" title="色違い">' : ''}
                    <img src="${displayImg}" loading="lazy">
                    <span class="no-text">No. ${s.id}</span>
                    <span class="jp-name">
                        ${s.displayName.replace(/（(.+?)）/, '<br><span class="sub-name">$1</span>')}
                    </span>
                    <div class="status-icons">
                        <img src="${ICON_REG}" class="icon-btn ${isReg ? '' : 'is-off'}" onclick="event.stopPropagation(); toggleStatus('${s.uKey}', 'reg')" title="図鑑登録">
                        <img src="${ICON_OWN}" class="icon-btn ${isDisabled ? 'is-disabled' : ''} ${isOff ? 'is-off' : ''}" onclick="event.stopPropagation(); toggleStatus('${s.uKey}', 'own')" title="${status}">
                    </div>
                </div>
            `;
        }).join('');

        document.getElementById('status').innerText = `表示中: ${filtered.length}件`;
        saveFilters();
    }

    function saveFilters() {
        const currentSettings = {
            gen: document.getElementById('filter-gen').value,
            cat: document.getElementById('filter-cat').value,
            soft: document.getElementById('filter-soft').value,
            reg: document.getElementById('filter-reg').value,
            own: document.getElementById('filter-own').value,
            shiny: filters.shiny,
            search: document.getElementById('search').value
        };
        localStorage.setItem('pokeFilterSettings', JSON.stringify(currentSettings));
    }

    async function toggleStatus(uKey, type) {
        const target = allSprites.find(s => s.uKey === uKey);
        if (!target) return;

        let colName = "";
        let newValue = "";

        if (type === 'reg') {
            target.regStatus = !target.regStatus;
            newValue = target.regStatus ? "YES" : "NO";
            colName = target.isShiny ? "HOME 図鑑登録 (色違い)" : "HOME 図鑑登録";
        } else {
            if (target.ownStatus === "不可") return;
            target.ownStatus = (target.ownStatus === "所持") ? "未所持" : "所持";
            newValue = target.ownStatus;
            colName = target.isShiny ? "HOME 所持状況 (色違い)" : "HOME 所持状況";
        }

        render();

        try {
            await fetch(GAS_URL, {
                method: "POST",
                body: JSON.stringify({ id: target.id, column: colName, value: newValue })
            });
        } catch (e) {
            console.error("保存失敗:", e);
            alert("保存に失敗しました。");
        }
    }

    function navDetail(direction) {
        const newIndex = currentViewIndex + direction;
    
        // リストの範囲内であれば新しいポケモンを表示
        if (newIndex >= 0 && newIndex < currentFilteredList.length) {
            showDetail(currentFilteredList[newIndex].uKey);
        }
    }

    function showDetail(uKey) {
        // 開く瞬間のuKeyから、最初は通常色か色違いかを判断する
        const targetSprite = allSprites.find(item => item.uKey === uKey);
        if (!targetSprite) return;
    
        isModalShiny = targetSprite.isShiny; // 開いた個体に合わせて初期状態をセット
        currentViewIndex = currentFilteredList.findIndex(item => item.uKey === uKey);

        renderModalContent(uKey); // 描画処理を別関数に切り出すと管理しやすくなります
    }

    // モーダルの内容を更新する専用の関数
    function renderModalContent(uKey) {
        const s = allSprites.find(item => item.uKey === uKey);
        if (!s) return;

        const modal = document.getElementById('detailModal');
        const body = document.getElementById('modal-body');

        const softs = ["GO", "ピカブイ", "剣盾", "BDSP", "アルセウス", "SV", "Z-A"];
        const softHtml = softs.map(name => {
            const key = `実装 (${name})`;
            const val = s[key];
            // YES か TRUE ならアクティブ（実装済み）と判定
            const isActive = val && (String(val).trim().toUpperCase() === "YES" || String(val).trim() === "TRUE");
            return `<span class="soft-badge ${isActive ? 'active' : ''}">${name}</span>`;
        }).join('');

        // --- リンク作成関数の定義（モーダル内の状態 isModalShiny を反映） ---
        const createIconLink = (namesString) => {
            if (!namesString || namesString === "ー") return "ー";
            const names = namesString.split(/[、,]\s*/);
            const links = names.map(name => {
                const trimmedName = name.trim();
                // モーダルが色違いモードなら、進化先も色違いを探す。なければ通常色。
                const target = allSprites.find(item => item.displayName === trimmedName && item.isShiny === isModalShiny) 
                            || allSprites.find(item => item.displayName === trimmedName && !item.isShiny);
            
                if (target && target.imgUrl) {
                    return `
                        <div class="mini-link-item" onclick="showDetail('${target.uKey}')" title="${trimmedName}">
                            <img src="${target.imgUrl}" class="mini-evo-img">
                        </div>`;
                }
                return `<span class="evolution-link" onclick="showDetail('${target?.uKey || ""}')">${trimmedName}</span>`;
            }).join('');
            return `<div class="mini-link-container">${links}</div>`;
        };

        const evolutionHtml = createIconLink(s["進化系"]);
        const variationsHtml = createIconLink(s["すがた違い"]);

        // ボタンの無効化処理
        document.getElementById('prev-btn').disabled = (currentViewIndex <= 0);
        document.getElementById('next-btn').disabled = (currentViewIndex >= currentFilteredList.length - 1);

        // 表示する画像の決定
        const displayImg = isModalShiny ? (s["画像 (色違い)"] || s.imgUrl) : (s["画像"] || s.imgUrl);

        // モーダルの中身を書き換え
        body.innerHTML = `
            <div style="text-align:center; position:relative;">
                <button onclick="toggleModalShiny('${s.uKey}')" class="modal-shiny-btn ${isModalShiny ? 'active' : ''}">
                    色違いモード
                </button>
                <img src="${displayImg}" style="width:150px; height:150px; object-fit:contain;">
                <h2>${s.displayName} <small>(No.${s.id})</small></h2>
            </div>
            <p><strong>カテゴリ：</strong> ${s["カテゴリ"]}</p>
            <p><strong>世代：</strong> ${s["世代"]}</p>
            <div style="margin: 15px 0;">
                <strong>実装ソフト：</strong>
                <div class="soft-icons" style="justify-content: flex-start; margin-top: 5px;">${softHtml}</div>
            </div>
            <hr>
            <p><strong>進化系：</strong><br>${evolutionHtml}</p>
            <p><strong>すがた違い：</strong><br>${variationsHtml}</p>
            <hr>
            <p><strong>進化方法：</strong><br>${s["進化方法"] || "情報なし"}</p>
            <p><strong>メモ：</strong><br>${s["メモ"] || "ー"}</p>
            <hr>
            <a href="${s["ポケ徹"]}" target="_blank" class="poke-link">🔗 ポケモン徹底攻略を見る</a>
        `;
        modal.style.display = "flex";
    }

    // モーダル内の色違いをトグルする関数
    function toggleModalShiny(currentUKey) {
        isModalShiny = !isModalShiny;
        // 状態を変えて再描画
        renderModalContent(currentUKey);
    }

    function closeModal(e) { if(e.target.id === 'detailModal') e.target.style.display = 'none'; }

    function toggleFilter(type) {
        filters[type] = !filters[type];
        const btn = document.getElementById(`btn-${type}`);
        if(btn) btn.classList.toggle('active-filter');
        render();
    }

    function loadFilters() {
        const saved = localStorage.getItem('pokeFilterSettings');
        if (saved) {
            const config = JSON.parse(saved);
            document.getElementById('filter-gen').value = config.gen || 'all';
            document.getElementById('filter-cat').value = config.cat || 'all';
            document.getElementById('filter-soft').value = config.soft || 'all';
            document.getElementById('filter-reg').value = config.reg || 'all';
            document.getElementById('filter-own').value = config.own || 'all';
            document.getElementById('search').value = config.search || '';
            filters.shiny = config.shiny || false;
            if (filters.shiny) document.getElementById('btn-shiny').classList.add('active-filter');
        }
    }

    function resetFilters() {
        document.getElementById('filter-gen').value = 'all';
        document.getElementById('filter-cat').value = 'all';
        document.getElementById('filter-soft').value = 'all';
        document.getElementById('filter-reg').value = 'all';
        document.getElementById('filter-own').value = 'all';
        document.getElementById('search').value = '';
        filters.shiny = false;
        document.getElementById('btn-shiny').classList.remove('active-filter');
        localStorage.removeItem('pokeFilterSettings');
        render();
    }

    document.getElementById('search').oninput = render;
    init();

    document.addEventListener('keydown', (e) => {
        // モーダルが表示されている時だけ反応させる
        const modal = document.getElementById('detailModal');
        if (modal.style.display === 'flex') {
            if (e.key === 'ArrowLeft') {
                navDetail(-1);
            } else if (e.key === 'ArrowRight') {
                navDetail(1);
            } else if (e.key === 'Escape') {
                modal.style.display = 'none';
            }
        }
    });



</script>
</body>
</html>
